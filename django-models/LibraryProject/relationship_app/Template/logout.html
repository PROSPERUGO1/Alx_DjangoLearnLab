<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .messages { margin: 20px 0; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>You have been logged out</h1>
    
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    
    <p><a href="{% url 'login' %}">Login again</a></p>
    <p><a href="{% url 'list_books' %}">Back to Books</a></p>
</body>
</html>
